# ===========================================
# Lighthouse CI - パフォーマンスリグレッション検知
# ===========================================

name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bonsai_sns_lhci?sslmode=disable"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/bonsai_sns_lhci?sslmode=disable"
  TWO_FACTOR_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  NEXTAUTH_SECRET: "bWyYBwK67fxzH43lneQbHU8hhb7EoLHKlrD3uHHGUXk="
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  AUTH_TRUST_HOST: "true"

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bonsai_sns_lhci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Setup database
        run: npx prisma db push

      - name: Seed data
        run: npx prisma db seed
        env:
          GUEST_PASSWORD: "GuestPass1!"

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Prepare standalone server
        run: |
          cp -r public .next/standalone/public 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r node_modules/.prisma .next/standalone/node_modules/.prisma 2>/dev/null || true
          cp -r node_modules/@prisma .next/standalone/node_modules/@prisma 2>/dev/null || true

      - name: Start server
        run: |
          cd .next/standalone
          node server.js &
          cd ../..
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/login > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 2
          done
        env:
          PORT: "3000"
          HOSTNAME: "0.0.0.0"
          NODE_ENV: "production"
          GUEST_PASSWORD: "GuestPass1!"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/login
            http://localhost:3000/
          runs: 3
          temporaryPublicStorage: true
          uploadArtifacts: true
          configPath: .lighthouserc.json
