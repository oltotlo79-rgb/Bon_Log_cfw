        style="filter: url(#roughpaper);" 
        opacity="0.85"/>
  <path d="M 245 45 C 395 45 440 145 440 245 C 440 375 345 445 245 445 C 135 445 55 355 55 255 C 55 125 145 45 245 45" 
        fill="none" 
