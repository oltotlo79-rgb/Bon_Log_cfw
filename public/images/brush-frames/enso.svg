      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <path d="M 250 50 C 400 50 450 150 450 250 C 450 380 350 450 250 450 C 130 450 50 350 50 250 C 50 120 150 40 250 40 C 370 40 460 140 460 250" 
