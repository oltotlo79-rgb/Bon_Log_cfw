# ============================================================
# Cloudflare Workers 設定
# ============================================================
#
# プレースホルダーの値は wrangler のバリデーションを通る形式にしてあるが、
# Phase 4 で実際の値に差し替えるまで本番デプロイは失敗する。
# 詳細: docs/CFW-MIGRATION.md / docs/MIGRATION-PLAN.md
#
# あなたが Phase 4 で実施することは:
#  1. `wrangler hyperdrive create bon-log-hyperdrive --connection-string="..."` で ID 取得
#  2. 下記 [[hyperdrive]] の id (00000000-... プレースホルダー) を実 ID に置換 (3 箇所)
#  3. r2_buckets[].bucket_name の `bon-log-uploads-placeholder` を実バケット名に置換 (3 箇所)
#  4. `wrangler secret put XXX --env staging` で各 secret を登録
# ============================================================

name = "bon-log"
main = ".open-next/worker.js"

# Workers の Node.js 互換は 2024-09-23 以降で nodejs_compat_v2 として安定提供。
# Buffer / fs/promises / crypto (AES-256-GCM 等) を使うには下記が必須。
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat_v2"]

# ------------------------------------------------------------
# Static Assets (画像・CSS・JS など)
# ------------------------------------------------------------
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ------------------------------------------------------------
# Hyperdrive: Supabase Postgres への TCP 接続プロキシ
# ------------------------------------------------------------
# Workers Sockets で Supabase へ直接接続すると "Connection terminated unexpectedly"
# で失敗するため、Hyperdrive 経由で接続する。Hyperdrive 自体が pool + cache を
# 持つので Worker 側は接続毎に短命接続で良い。
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "6569f48a-42d6-48f1-ba85-fb0a5121af3d"
# ローカル開発時は localhost Postgres を使う (`wrangler dev` 起動時)
localConnectionString = "postgresql://postgres:postgres@localhost:5432/bonsai_sns"

# ------------------------------------------------------------
# R2 binding (既存の R2 バケット)
# ------------------------------------------------------------
# Phase 2 以降で `lib/storage/r2-provider.ts` を binding 経由に書き換える予定。
# 暫定では process.env.R2_* の AccessKey 経由でも動作する。
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bon-log-uploads-placeholder"

# ------------------------------------------------------------
# Cron Triggers (vercel.json の crons の代替)
# ------------------------------------------------------------
# Phase 6 までは disable しておくこと (Vercel 側 cron との二重実行防止)
# [triggers]
# crons = [
#   "*/5 * * * *",   # /api/cron/publish-scheduled
#   "0 1 * * *",     # /api/cron/check-subscriptions
#   "0 0 1 * *",     # /api/cron/cleanup-events
# ]

# ------------------------------------------------------------
# Module rules
# ------------------------------------------------------------
# Prisma 6 の query compiler は .wasm を CJS `require('./*.wasm')` (top-level)
# でロードする。Workers では .wasm の static binding を作るためにここで宣言する。
# Wrangler v4 は ESM `import` 経由なら自動検出するが、CJS require の場合は
# 明示宣言が必要なため Fallthrough を防ぐ目的でも入れておく。
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# ------------------------------------------------------------
# Observability (Workers Logs)
# ------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1.0

# ------------------------------------------------------------
# ステージング環境
# ------------------------------------------------------------
[env.staging]
name = "bon-log-staging"
# Phase 4 で DNS を追加してから enable:
# route = { pattern = "staging.bon-log.com/*", zone_name = "bon-log.com" }

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "6569f48a-42d6-48f1-ba85-fb0a5121af3d"
localConnectionString = "postgresql://postgres:postgres@localhost:5432/bonsai_sns"

[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bon-log-uploads-placeholder"

# ------------------------------------------------------------
# 本番環境
# ------------------------------------------------------------
# ⚠ Phase 6 のカットオーバーまで route はコメントアウトしておくこと
[env.production]
name = "bon-log-prod"
# route = { pattern = "bon-log.com/*", zone_name = "bon-log.com" }

# Phase 6 (本番カットオーバー) では本番用 Hyperdrive を別途作成して
# 下記 id を差し替える。staging と同じ ID を使うのは Phase 5 までの暫定。
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "6569f48a-42d6-48f1-ba85-fb0a5121af3d"
localConnectionString = "postgresql://postgres:postgres@localhost:5432/bonsai_sns"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bon-log-uploads-placeholder"

# 本番でのみ cron を有効化 (Phase 6 のカットオーバー直前にコメントアウト解除)
# [env.production.triggers]
# crons = [
#   "*/5 * * * *",
#   "0 1 * * *",
#   "0 0 1 * *",
# ]
